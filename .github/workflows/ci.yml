name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          check-latest: true

      - name: Verify git is new enough for worktree add -b
        run: git --version

      # seed-all exercises the cross-compile for every release platform; the
      # full-matrix embed check in ./seed then runs before `make build` trims
      # seed/dist back to the host platform.
      - run: make seed-all
      - run: make lint
      # `go test ./...` is the cross-cutting exit gate (roadmap §4): it runs the
      # F1 quickstart regression suite S1–S12 (the create_*/invalid_*/rollback/
      # shell_integration/non_interactive_missing scenarios, unchanged since
      # release 0.1 — SC-007) alongside every F2 unit, integration, and
      # fault-injection suite, on all three OSes.
      - run: go test ./...
      - name: Host build smoke test
        run: make build
